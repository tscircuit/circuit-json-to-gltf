name: Compare imported model snapshots before and after fanout
on:
  push:
    branches: [codex/review-imported-model-baselines-20261007]
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - name: Check unchanged pre-fanout code against current imported assets
        continue-on-error: true
        run: bun test tests/repro/repro6.test.tsx tests/snapshot/gltf-url-component.test.ts tests/features/glb-models/glb-models01.test.tsx tests/features/translucent-glb-models/translucent-cadmodel.test.tsx --timeout 30000
      - name: Install current fanout renderer
        run: |
          bun -e 'const m = await Bun.file("package.json").json(); m.dependencies["jscad-electronics"] = "https://pkg.pr.new/tscircuit/jscad-electronics@2cfc900"; await Bun.write("package.json", JSON.stringify(m, null, 2));'
          bun install
      - name: Render current imported assets for inspection
        run: bun test tests/repro/repro6.test.tsx tests/snapshot/gltf-url-component.test.ts tests/features/glb-models/glb-models01.test.tsx tests/features/translucent-glb-models/translucent-cadmodel.test.tsx --timeout 30000
        env:
          BUN_UPDATE_SNAPSHOTS: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: imported-model-baseline-review
          path: |
            tests/repro/__snapshots__/repro6.snap.png
            tests/snapshot/__snapshots__/gltf-url-component.snap.png
            tests/features/glb-models/__snapshots__/glb-models01.snap.png
            tests/features/translucent-glb-models/__snapshots__/translucent-cadmodel-standalone.snap.png
          if-no-files-found: error
